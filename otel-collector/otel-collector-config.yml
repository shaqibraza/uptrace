receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  otlphttp/uptrace:
    endpoint: http://host.docker.internal:4000
    headers:
      x-uptrace-api-key: "${env:UPTRACE_API_KEY}"

service:
  pipelines:
    traces:
      receivers:
        - otlp

      processors:
        - batch

      exporters:
        - otlphttp/uptrace